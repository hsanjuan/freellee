name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"

jobs:
  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Decode keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE }}" | base64 -d > freellee-release.keystore

      - name: Grant wrapper execute permission
        run: chmod +x ./gradlew

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/freellee-release.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEY_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk freellee.apk
          sha256sum freellee.apk > freellee.apk.sha256

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            freellee.apk
            freellee.apk.sha256
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            freellee.apk
            freellee.apk.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
