MaintainerNotes: |-
  Freellee requires Android 14 (API 34) or newer. Health Connect is part of the platform on
  Android 14+, so Google's standalone Health Connect app (com.google.android.apps.healthdata,
  required on Android 13 and below) is not needed and is no longer queried. A package query for
  org.lineageos.health is kept for LineageOS builds that ship their own Health Connect.
  The release APK is signed with the upstream key (see AllowedAPKSigningKeys) and the project's
  GitHub Actions workflow is set up for reproducible builds.
  The RFP bot hostname table flags issuetracker.google.com as "Tracking". This is a false
  positive: the only occurrences are two bug-report URL strings in the error messages of
  androidx.datastore:datastore-core (DataStoreImpl, pulled in by datastore-preferences). They are
  not tracking code, and the app declares no INTERNET permission, so it cannot contact the
  domain. Exodus Privacy's code-signature analysis reports zero trackers.

